name: Blogger Auto News Bot

on:
  schedule:
    # 毎日日本時間の朝 7:00（世界標準時 UTC では前日の 22:00）に実行
    - cron: '0 22 * * *'
  workflow_dispatch: # ボタンを押して手動でいつでも即時実行できる設定

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        persist-credentials: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run script
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        BLOG_ID: ${{ secrets.BLOG_ID }}
        CLIENT_ID: ${{ secrets.CLIENT_ID }}
        CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
      run: python main.py

    - name: Commit and push historical data
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        # posted_links.txt に変更（新規追記）があった場合のみコミットしてプッシュ
        if [ -f posted_links.txt ]; then
          git add posted_links.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "📊 投稿履歴の自動更新" && git push)
        fi
